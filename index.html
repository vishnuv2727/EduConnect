<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>REVA University, Bengaluru - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            height: 100vh;
            padding: 20px;
            position: fixed;
            left: 0;
            top: 0;
            overflow-y: auto;
        }
        .sidebar h2 {
            text-align: center;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            padding: 10px;
            border-bottom: 1px solid #34495e;
        }
        .sidebar ul li a {
            color: white;
            text-decoration: none;
            display: block;
        }
        .main-content {
            margin-left: 270px;
            padding: 20px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f4f4f4;
            padding: 15px;
            border-bottom: 2px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Menu</h2>
        <ul>
            <li><a href="notes.html">Notes</a></li>
            <li><a href="pyqs.html">Previous Year Questions</a></li>
            <li><a href="imp_questions.html">Important Questions</a></li>
            <li><a href="upload.html">Upload Study Material</a></li>
        </ul>
    </div>
    
    <div class="main-content">
        <div class="header">
            <h1>Welcome to REVA University, Bengaluru</h1>
            <span id="profile-name"></span>
        </div>
        
        <div>
            <h2>Dashboard</h2>
            <p>Select an option from the left menu.</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let userData = JSON.parse(localStorage.getItem("loggedInUser"));
            if (userData) {
                document.getElementById("profile-name").innerText = userData.name;
            }
        });
    </script>
</body>
</html>
